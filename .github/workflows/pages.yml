name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02 Site/package-lock.json
      - name: Build the site
        working-directory: 02 Site
        env:
          BASE: /portfolio/site
        run: |
          npm ci
          npm run build
      - name: Combine the existing files with the new site
        run: |
          mkdir _out
          rsync -a --exclude='02 Site' --exclude='.git' --exclude='.github' --exclude='_out' ./ _out/
          mkdir -p _out/site
          cp -r "02 Site/dist/." _out/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _out
      - id: deployment
        uses: actions/deploy-pages@v4
